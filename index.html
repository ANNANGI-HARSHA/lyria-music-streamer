<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyria Realtime Stream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #6a11cb;
            --secondary-color: #2575fc;
            --green-color: #1ed760;
            --red-color: #dc3545;
            --yellow-color: #ffc107;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333;
            --text-light: #777;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 2.5rem 3rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            text-align: center;
            transition: all 0.3s ease;
        }
        .header { margin-bottom: 2rem; }
        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-color);
            margin: 0 0 0.5rem 0;
        }
        .header h1 span {
            background: -webkit-linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            color: var(--text-light);
            font-size: 1rem;
            line-height: 1.5;
            margin: 0;
        }
        textarea {
            width: 100%;
            min-height: 100px;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            margin-top: 8px;
            resize: vertical;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.15);
        }
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            width: 100%;
            margin-top: 15px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }
        button:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
            opacity: 0.7;
        }
        #connect-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
        }
        #disconnect-btn {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            color: white;
        }
        #generate-btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
        }

        /* --- New Recording Button Styles --- */
        #start-record-btn {
            background: linear-gradient(135deg, var(--red-color) 0%, #ff6b6b 100%);
            color: white;
        }
        #stop-record-btn {
            background: linear-gradient(135deg, var(--yellow-color) 0%, #ffc107 100%);
            color: #333;
        }
        .hidden { display: none; }
        
        #status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 1.5rem;
            min-height: 24px;
        }
        #status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--text-light);
            margin-right: 10px;
            transition: background-color 0.3s ease;
        }
        #status-indicator.connecting {
            background-color: var(--yellow-color);
            animation: pulse-yellow 1.5s infinite;
        }
        #status-indicator.connected {
            background-color: var(--green-color);
            animation: pulse-green 1.5s infinite;
        }
        #status-indicator.recording {
            background-color: var(--red-color);
            animation: pulse-red 1.5s infinite;
        }
        #status-indicator.error { background-color: var(--red-color); }
        #status-text {
            color: var(--text-light);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* --- New Results Section Styles --- */
        #results-container {
            margin-top: 2rem;
            border-top: 1px solid #eee;
            padding-top: 1.5rem;
        }
        #results-container h3 {
            margin-top: 0;
            color: var(--text-color);
        }
        #audio-playback {
            width: 100%;
            margin-bottom: 1rem;
        }
        #download-link {
            display: inline-block;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            background-color: var(--green-color);
            color: white;
            transition: background-color 0.2s ease;
        }
        #download-link:hover {
            background-color: #1aa049;
        }

        hr {
            border: none;
            border-top: 1px solid #eee;
            margin: 1.5rem 0;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(30, 215, 96, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(30, 215, 96, 0); }
            100% { box-shadow: 0 0 0 0 rgba(30, 215, 96, 0); }
        }
        @keyframes pulse-yellow {
            0% { box-shadow: 0 0 0 0 rgba(255, 193, 7, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(255, 193, 7, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 193, 7, 0); }
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Lyria <span>Realtime</span></h1>
            <p>Connect to the server and send prompts to generate a live, continuous stream of music.</p>
        </div>
        
        <div id="connect-container">
            <button id="connect-btn">Connect to Server</button>
        </div>

        <div id="controls-container" class="hidden">
            <label for="prompt-input" style="text-align: left; display: block; font-weight: 500; color: var(--text-color);">Your Prompt:</label>
            <textarea id="prompt-input" placeholder="e.g., A cinematic, orchestral score with rising strings and triumphant brass."></textarea>
            <button id="generate-btn">Update Prompt</button>
            
            <hr>

            <div id="record-controls">
                <button id="start-record-btn">Start Recording</button>
                <button id="stop-record-btn" class="hidden">Stop Recording</button>
            </div>
            
            <hr>
            
            <button id="disconnect-btn">Disconnect</button>
        </div>

        <div id="status-container">
            <div id="status-indicator"></div>
            <p id="status-text">Disconnected</p>
        </div>

        <div id="results-container" class="hidden">
            <h3>Your Recording</h3>
            <audio id="audio-playback" controls></audio>
            <a id="download-link" href="#" download="lyria_recording.wav">Download WAV</a>
        </div>

    </div>
    <script>
        // --- Global Variables ---
        let socket = null;
        let audioContext = null;
        let audioQueue = [];
        let isPlaying = false;
        let nextPlayTime = 0;
        const AUDIO_SAMPLE_RATE = 48000; // Lyria streams at 48kHz

        // --- New Recording Variables ---
        let isRecording = false;
        let recordedBuffers = [];
        let currentAudioUrl = null;

        // --- DOM Elements ---
        const connectBtn = document.getElementById('connect-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const generateBtn = document.getElementById('generate-btn');
        const promptInput = document.getElementById('prompt-input');
        const statusText = document.getElementById('status-text');
        const statusIndicator = document.getElementById('status-indicator');
        const connectContainer = document.getElementById('connect-container');
        const controlsContainer = document.getElementById('controls-container');

        // --- New DOM Elements ---
        const startRecordBtn = document.getElementById('start-record-btn');
        const stopRecordBtn = document.getElementById('stop-record-btn');
        const resultsContainer = document.getElementById('results-container');
        const audioPlayback = document.getElementById('audio-playback');
        const downloadLink = document.getElementById('download-link');

        // --- Audio Playback Engine ---
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: AUDIO_SAMPLE_RATE 
                });
                nextPlayTime = audioContext.currentTime;
                console.log("AudioContext initialized at " + audioContext.sampleRate + "Hz.");
            }
        }

        function scheduleBuffers() {
            if (!audioContext || isPlaying || audioQueue.length === 0) {
                return;
            }
            isPlaying = true;
            const chunkData = audioQueue.shift();
            const pcmData = new Float32Array(chunkData.buffer);
            const audioBuffer = audioContext.createBuffer(2, pcmData.length / 2, AUDIO_SAMPLE_RATE);
            const left = audioBuffer.getChannelData(0);
            const right = audioBuffer.getChannelData(1);
            for (let i = 0; i < pcmData.length; i += 2) {
                left[i / 2] = pcmData[i];
                right[i / 2] = pcmData[i + 1];
            }
            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioContext.destination);
            const playTime = Math.max(audioContext.currentTime, nextPlayTime);
            source.start(playTime);
            nextPlayTime = playTime + audioBuffer.duration;
            source.onended = () => {
                isPlaying = false;
                scheduleBuffers();
            };
        }

        // --- WebSocket Logic ---
        function connectWebSocket() {
            initAudio();
            socket = new WebSocket("ws://127.0.0.1:5000/ws");
            socket.binaryType = "arraybuffer";

            socket.onopen = (event) => {
                statusText.textContent = "Connected! Send a prompt to start.";
                statusIndicator.className = 'connected';
                connectContainer.classList.add('hidden');
                controlsContainer.classList.remove('hidden');
            };

            socket.onmessage = (event) => {
                if (typeof event.data === "string") {
                    // This is a text message (e.g., an error from the server)
                    statusText.textContent = event.data;
                    statusIndicator.className = 'error';
                } else {
                    // This is raw audio data (ArrayBuffer)
                    const pcm16Data = event.data;
                    
                    // --- NEW: Store for recording if active ---
                    if (isRecording) {
                        // Store the raw ArrayBuffer. It's more efficient.
                        recordedBuffers.push(pcm16Data);
                    }

                    // --- Process for live playback ---
                    const rawPcm16 = new Int16Array(pcm16Data);
                    const pcmFloat32 = new Float32Array(rawPcm16.length);
                    for (let i = 0; i < rawPcm16.length; i++) {
                        pcmFloat32[i] = rawPcm16[i] / 32768;
                    }
                    audioQueue.push(pcmFloat32);
                    scheduleBuffers();
                }
            };

            socket.onclose = (event) => {
                statusText.textContent = "Disconnected from server.";
                statusIndicator.className = '';
                connectContainer.classList.remove('hidden');
                controlsContainer.classList.add('hidden');
                resultsContainer.classList.add('hidden'); // Hide results on disconnect
                socket = null;
                audioQueue = []; 
                if (isRecording) {
                    // If we were recording, stop and process the file
                    stopRecording();
                }
            };

            socket.onerror = (errorEvent) => {
                console.error("WebSocket Error occurred:", errorEvent);
                statusText.textContent = "Connection error. Check console.";
                statusIndicator.className = 'error';
            };
        }

        // --- NEW: Recording Logic ---
        function startRecording() {
            isRecording = true;
            recordedBuffers = []; // Clear previous recording
            
            // Clear previous results
            resultsContainer.classList.add('hidden');
            if (currentAudioUrl) {
                URL.revokeObjectURL(currentAudioUrl);
                currentAudioUrl = null;
            }
            audioPlayback.src = '';
            
            // Update UI
            startRecordBtn.classList.add('hidden');
            stopRecordBtn.classList.remove('hidden');
            statusText.textContent = "Recording... Send prompts to add music.";
            statusIndicator.className = 'recording';
        }

        function stopRecording() {
            isRecording = false;
            
            // Update UI
            startRecordBtn.classList.remove('hidden');
            stopRecordBtn.classList.add('hidden');
            statusText.textContent = "Connected. Processing recording...";
            statusIndicator.className = 'connected'; // Back to connected state

            if (recordedBuffers.length === 0) {
                statusText.textContent = "Recording stopped. No audio was captured.";
                return;
            }

            // Process the recorded data
            const pcmBlob = new Blob(recordedBuffers, { type: 'application/octet-stream' });
            console.log(`PCM Blob size: ${pcmBlob.size} bytes`);

            // Encode the raw PCM blob into a WAV blob
            const wavBlob = encodeWAV(pcmBlob, AUDIO_SAMPLE_RATE, 2, 16);
            console.log(`WAV Blob size: ${wavBlob.size} bytes`);
            
            // Create a playable URL for the WAV blob
            currentAudioUrl = URL.createObjectURL(wavBlob);
            
            // Update the results player and download link
            audioPlayback.src = currentAudioUrl;
            downloadLink.href = currentAudioUrl;
            
            // Show the results
            resultsContainer.classList.remove('hidden');
            statusText.textContent = "Recording finished and ready for playback.";
        }

        /**
         * Encodes a raw PCM data Blob into a WAV file Blob.
         * @param {Blob} pcmBlob - The Blob containing raw PCM data.
         * @param {number} sampleRate - The sample rate (e.g., 48000).
         * @param {number} numChannels - Number of channels (e.g., 2 for stereo).
         * @param {number} bitsPerSample - Bits per sample (e.g., 16).
         * @returns {Blob} A new Blob containing the complete WAV file.
         */
        function encodeWAV(pcmBlob, sampleRate, numChannels, bitsPerSample) {
            const pcmDataSize = pcmBlob.size;
            const bytesPerSample = bitsPerSample / 8;
            const blockAlign = numChannels * bytesPerSample;
            const byteRate = sampleRate * blockAlign;
            const wavHeaderSize = 44;
            
            const totalFileSize = wavHeaderSize + pcmDataSize;
            
            const buffer = new ArrayBuffer(wavHeaderSize);
            const view = new DataView(buffer);

            // RIFF chunk descriptor
            writeString(view, 0, 'RIFF');
            view.setUint32(4, totalFileSize - 8, true); // (file size - 8)
            writeString(view, 8, 'WAVE');
            
            // "fmt " sub-chunk
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); // Sub-chunk size (16 for PCM)
            view.setUint16(20, 1, true); // Audio format (1 for PCM)
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);
            
            // "data" sub-chunk
            writeString(view, 36, 'data');
            view.setUint32(40, pcmDataSize, true);

            // Helper function to write a string to the DataView
            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }
            
            // Return a new Blob combining the header and the PCM data
            return new Blob([buffer, pcmBlob], { type: 'audio/wav' });
        }


        // --- Event Listeners ---
        connectBtn.addEventListener('click', () => {
            statusText.textContent = "Connecting...";
            statusIndicator.className = 'connecting';
            connectWebSocket();
        });

        disconnectBtn.addEventListener('click', () => {
            if (socket) {
                socket.close();
            }
        });

        generateBtn.addEventListener('click', () => {
            const prompt = promptInput.value;
            if (!prompt) {
                alert('Please enter a prompt.');
                return;
            }
            if (socket && socket.readyState === WebSocket.OPEN) {
                statusText.textContent = "Sending new prompt...";
                statusIndicator.className = isRecording ? 'recording' : 'connecting'; // Show activity
                socket.send(prompt);
                
                setTimeout(() => {
                    if (socket && socket.readyState === WebSocket.OPEN) {
                        const newStatus = isRecording ? "Recording new prompt..." : "Connected. Streaming new prompt...";
                        statusText.textContent = newStatus;
                        statusIndicator.className = isRecording ? 'recording' : 'connected';
                    }
                }, 1500);
            }
        });

        // --- New Event Listeners ---
        startRecordBtn.addEventListener('click', startRecording);
        stopRecordBtn.addEventListener('click', stopRecording);

    </script>
</body>
</html>
